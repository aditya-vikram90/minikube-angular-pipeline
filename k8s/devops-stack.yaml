apiVersion: v1
kind: Namespace
metadata:
  name: devops
---
# ---------- Docker Registry ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: devops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: devops
spec:
  clusterIP: 10.96.0.50        # fixed IP, taaki image path stable rahe
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
---
# ---------- Nexus ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: devops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: devops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: nexus }
  template:
    metadata:
      labels: { app: nexus }
    spec:
      securityContext:
        fsGroup: 200
      containers:
        - name: nexus
          image: sonatype/nexus3:latest
          ports:
            - containerPort: 8081
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g"
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 3Gi }
          readinessProbe:
            httpGet: { path: /service/rest/v1/status, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /nexus-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexus-data
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: devops
spec:
  type: NodePort
  selector: { app: nexus }
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
